<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字キーホルダーメーカー</title>
<meta name="description" content="文字とフォントを選ぶだけで、3D プリンター用の文字キーホルダー (3MF / STL / OBJ) を作れます">
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1f2328; --muted: #6a737d; --line: #e3e6ea;
  --accent: #2f6fde; --accent-text: #fff; --warn-bg: #fff4d6; --warn: #8a5a00; --err-bg: #fde8e8; --err: #b42318;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
  display: grid; grid-template-columns: 360px 1fr; grid-template-rows: 100%;
}
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.controls { overflow-y: auto; padding: 16px 18px 8px; flex: 1; }
h1 { font-size: 17px; margin: 0 0 14px; }
section { padding: 12px 0; border-top: 1px solid var(--line); }
section > h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; letter-spacing: .04em; }
label.field { display: block; margin-bottom: 10px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.field-head small { color: var(--muted); }
textarea, input[type=text], input[type=search], select {
  width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: inherit;
}
textarea { resize: vertical; font-size: 18px; min-height: 52px; }
select[size] { padding: 2px; height: 210px; }
select[size] option { padding: 4px 6px; border-radius: 4px; }
.check { display: flex; gap: 6px; align-items: center; margin: 6px 0; color: var(--muted); font-size: 13px; }
.slider { display: grid; grid-template-columns: 1fr 72px; gap: 8px; align-items: center; }
.slider input[type=range] { width: 100%; accent-color: var(--accent); }
.slider input[type=number] { width: 72px; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; text-align: right; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.seg button { flex: 1; font: inherit; padding: 7px 4px; border: 0; background: #fff; color: inherit; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #0003; cursor: pointer; padding: 0; }
.swatch.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.hex { display: inline-flex; align-items: center; gap: 6px; }
.hex-preview { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #0003; flex: none; }
.hex input { width: 92px; padding: 4px 8px; font: inherit; font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  border: 1px solid var(--line); border-radius: 6px; }
.hex input.invalid { border-color: var(--err); background: var(--err-bg); }
.toolbar { display: grid; gap: 8px; margin-bottom: 8px; }
.font-filter { display: flex; gap: 8px; align-items: center; }
.font-filter input[type=search] { flex: 1; padding: 5px 8px; font-size: 13px; }
button.small { font: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; white-space: nowrap; }
button.small:disabled { opacity: .5; cursor: default; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.credits { font-size: 12px; color: var(--muted); text-align: center; }
.credits a { color: inherit; }
.toolbar .palette { margin: 0; }
.editor {
  min-height: 76px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #f6f7f9;
  font-size: 28px; line-height: 1.35; white-space: pre-wrap; word-break: break-all; outline: none;
  text-shadow: 0 0 1px #0005;
}
.editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #2f6fde22; }
.editor:empty::before { content: "文字を入力"; color: var(--muted); text-shadow: none; }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
button.link { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; margin-bottom: 8px; }
.colors { display: flex; gap: 16px; }
.colors label { display: flex; gap: 6px; align-items: center; }
.colors input { width: 36px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; }
.download { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.download .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.download button {
  font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); cursor: pointer;
}
.download button:disabled { opacity: .5; cursor: default; }
main { position: relative; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; left: 16px; top: 16px; display: grid; gap: 8px; max-width: calc(100% - 32px); pointer-events: none; }
.badge { background: #ffffffe6; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; width: fit-content; }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge.err { background: var(--err-bg); color: var(--err); border-color: transparent; }
.view-buttons { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; }
.view-buttons button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
.busy { position: absolute; right: 16px; top: 16px; color: var(--muted); font-size: 13px; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 45vh auto; }
  main { grid-row: 1; }
  aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
}
</style>
<style id="fontFaces"></style>
</head>
<body>
<aside>
  <div class="controls">
    <h1>文字キーホルダーメーカー</h1>

    <section>
      <h2>文字</h2>
      <div class="toolbar">
        <select id="font" title="フォント"></select>
        <div class="font-filter">
          <input id="fontSearch" type="search" placeholder="フォントを検索">
          <button class="small" id="localFonts" title="この PC にインストールされているフォントを一覧に加えます (Chrome / Edge)">PC のフォント</button>
        </div>
        <p class="note" id="fontNote" hidden></p>
        <div class="palette">
          <span id="palette" style="display:contents"></span>
          <span class="hex" title="色コード (#rrggbb) を入力して Enter">
            <span class="hex-preview" id="textHexPreview"></span>
            <input id="textHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#e0464d">
          </span>
        </div>
      </div>
      <div id="editor" class="editor" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true"></div>
      <p class="hint">文字を選択してからフォントや色を選ぶと、その部分だけ変わります（選択していないときは全体）。Enter で改行。</p>
    </section>

    <section>
      <h2>大きさ・太さ</h2>
      <div id="sizeFields"></div>
    </section>

    <section>
      <h2>厚み</h2>
      <div id="thicknessFields"></div>
    </section>

    <section>
      <h2>枠</h2>
      <div class="seg" id="plate">
        <button data-v="outline">文字の周り</button><button data-v="rect">四角</button>
        <button data-v="circle">丸</button><button data-v="ellipse">楕円</button>
      </div>
      <div id="plateFields"></div>
      <div class="colors"><label>土台の色
        <span class="hex" title="色コード (#rrggbb) を入力して Enter">
          <span class="hex-preview" id="baseHexPreview"></span>
          <input id="baseHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#f2f2f2">
        </span></label></div>
    </section>

    <section>
      <h2>リング (左上)</h2>
      <div id="ringFields"></div>
    </section>

  </div>

  <div class="download">
    <div class="row">
      <select id="format">
        <option value="3mf">3MF (おすすめ)</option>
        <option value="stl">STL</option>
        <option value="obj">OBJ</option>
        <option value="obj-y">OBJ (Y-up / Blender 等)</option>
      </select>
      <input id="filename" type="text" placeholder="ファイル名">
    </div>
    <button id="download">ダウンロード</button>
    <div class="credits"><a href="credits.html" target="_blank">クレジット・ライセンス</a></div>
  </div>
</aside>

<main>
  <canvas id="view"></canvas>
  <div class="overlay">
    <div class="badge" id="size">—</div>
    <div class="badge warn" id="warn" hidden></div>
    <div class="badge err" id="error" hidden></div>
  </div>
  <div class="busy" id="busy" hidden>更新中…</div>
  <div class="view-buttons">
    <button id="viewTop">真上から</button>
    <button id="viewReset">視点リセット</button>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
